<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@font-face{font-family:'Anton';src:url('../../seed/fonts/Anton.ttf')format('truetype');font-weight:400}
@font-face{font-family:'Devnag';src:url('../../seed/fonts/NotoSansDevanagari.ttf')format('truetype')}
@font-face{font-family:'Grotesk';src:url('../../seed/fonts/SpaceGrotesk.ttf')format('truetype')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#070B08}
#stage{position:absolute;inset:0;background:#070B08;font-family:'Grotesk',monospace}
.slide{position:absolute;inset:0;display:none}
.card{position:absolute;left:38px;top:332px;width:1004px;height:1255px;object-fit:contain;background:#070B08}
.cardframe{position:absolute;left:32px;top:326px;width:1016px;height:1267px;border:4px solid #B9FF3F;pointer-events:none}
.band{position:absolute;left:0;right:0;color:#EAFFF4}
.band.top{top:0;height:326px;padding:56px 64px 0}
.eyebrow{font-size:30px;letter-spacing:.30em;color:#B9FF3F;text-transform:uppercase}
.title{font-family:'Anton',sans-serif;font-size:152px;line-height:.98;color:#EAFFF4;letter-spacing:.01em;margin-top:26px}
.title .a{color:#B9FF3F}
.subt{font-size:38px;color:#7d867f;margin-top:22px;letter-spacing:.04em}
.band.bot{bottom:0;height:333px;padding:0 64px 64px;display:flex;flex-direction:column;justify-content:flex-end}
.slidetag{font-family:'Anton',sans-serif;font-size:64px;color:#070B08;background:#B9FF3F;display:inline-block;padding:8px 26px;transform:skew(-4deg);margin-bottom:26px;letter-spacing:.02em;max-width:max-content}
.beats{display:flex;gap:14px;margin-bottom:22px}
.beat{width:44px;height:14px;background:#1d2720;border-radius:3px}
.beat.on{background:#B9FF3F}
.prog{height:6px;background:#1d2720;border-radius:3px;position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;background:#2EDE82;border-radius:3px}
.counter{position:absolute;right:64px;top:56px;font-size:30px;color:#7d867f;letter-spacing:.2em}
.endcard h1{font-family:'Anton',sans-serif;font-size:128px;line-height:1;color:#EAFFF4;margin:0 64px}
.endcard h1 span{color:#B9FF3F}
.endcard .r{font-size:44px;color:#7d867f;margin:34px 64px 0;letter-spacing:.06em}
.chiprow{margin:44px 64px 0;display:flex;gap:18px;flex-wrap:wrap}
.chip{font-family:'Anton',sans-serif;font-size:40px;padding:10px 26px;border-radius:14px;letter-spacing:.03em}
.chip.ac{background:#B9FF3F;color:#070B08}
.chip.go{background:#FFD34D;color:#070B08}
.chip.gr{background:#2EDE82;color:#070B08}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.07;z-index:50}
.flash{position:absolute;inset:0;background:#B9FF3F;opacity:0;pointer-events:none;z-index:40}
.fullcard{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const BAR = 1.875;               // 128bpm bar
const BEAT = BAR / 4;
const POSTS = './reel_assets/';
// slide defs: [type, ref, tag, bars]
const SLIDES = [
  {type:'title', bars:2},
  {type:'post', src:POSTS+'M1_drake_crop.jpg',   tag:"DRAKE'S CHOICE"},
  {type:'post', src:POSTS+'M7_cat_crop.jpg',     tag:'DINNER DEBATE'},
  {type:'post', src:POSTS+'M2_buttons_crop.jpg', tag:'THE DAILY STRUGGLE'},
  {type:'post', src:POSTS+'M4_puppet_crop.jpg',  tag:'SIDE-EYE'},
  {type:'post', src:POSTS+'M5_panik_crop.jpg',   tag:'KALM·PANIK·KALM'},
  {type:'post', src:POSTS+'M6_dbf_crop.jpg',     tag:'THE AFFAIR'},
  {type:'post', src:POSTS+'M3_cmm_crop.jpg',     tag:'CHANGE MY MIND'},
  {type:'post', src:POSTS+'M8_gru_crop.jpg',     tag:'THE PLAN'},
  {type:'post', src:'../FINALE/posts/P1_hero.jpg',    tag:'POSTER 01/06'},
  {type:'post', src:'../FINALE/posts/P5_kabadi.jpg',  tag:'POSTER 05/06'},
  {type:'end', bars:2},
];
let starts = [], acc = 0;
SLIDES.forEach(s => { starts.push(acc); acc += (s.bars||1); });
const DUR = acc * BAR;  // 26.25s
const stage = document.getElementById('stage');
const els = SLIDES.map((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide';
  if (s.type === 'title') {
    el.innerHTML = `<div class="band top"><div class="eyebrow">VIReceipts · FINALE presents</div>
      <div class="title">THE INTERNET<br>ON <span class="a">E-WASTE.</span></div>
      <div class="subt">8 memes · 6 posters · 1 drawer — full set drops today</div></div>
      <div class="band bot"><div class="beats">${'<div class="beat"></div>'.repeat(8)}</div>
      <div class="prog"><i></i></div></div>`;
  } else if (s.type === 'post') {
    el.innerHTML = `<img class="card" src="${s.src}"><div class="cardframe"></div>
      <div class="counter">${String(i).padStart(2,'0')}/14</div>
      <div class="band top"><div class="eyebrow">VIReceipts · THE FINALE</div></div>
      <div class="band bot"><div class="slidetag">${s.tag}</div>
      <div class="beats">${'<div class="beat"></div>'.repeat(4)}</div>
      <div class="prog"><i></i></div></div>`;
  } else {
    el.innerHTML = `<div class="fullcard endcard"><h1>OPEN YOUR<br><span>DRAWER.</span></h1>
      <div class="r">weigh it. post it. tag #EWasteOff — that's the whole game.</div>
      <div class="chiprow"><div class="chip ac">#EWasteOff</div><div class="chip gr">CWC 2026 · 1M1B</div>
      <div class="chip go">TOP 3 → GENEVA</div></div>
      <div class="r" style="font-size:32px;margin-top:40px">सब receipt-driven. sources in bio.</div></div>`;
  }
  stage.appendChild(el);
  return el;
});
const flash = document.createElement('div'); flash.className='flash'; stage.appendChild(flash);
const grain = document.createElement('div'); grain.id='grain'; stage.appendChild(grain);
(function mkgrain(){const c=document.createElement('canvas');c.width=270;c.height=480;const g=c.getContext('2d');
const id=g.createImageData(270,480);for(let i=0;i<id.data.length;i+=4){const v=110+Math.random()*40;
id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0);
grain.style.background=`url(${c.toDataURL()})`;})();
function easeOutBack(x){const c=1.70158;return 1+ (c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}
function seek(t){
  let idx = -1, t0 = 0;
  for (let i = 0; i < SLIDES.length; i++) if (t >= starts[i]*BAR) { idx = i; t0 = starts[i]*BAR; }
  els.forEach((el, i) => el.style.display = (i === idx) ? 'block' : 'none');
  const el = els[idx];
  const bars = SLIDES[idx].bars || 1;
  const tl = (t - t0) / (bars * BAR);
  // progress + beat lamps
  const prog = el.querySelector('.prog i'); if (prog) prog.style.width = (t / DUR * 100) + '%';
  const beats = el.querySelectorAll('.beat');
  const litN = Math.floor((t / BEAT) % (beats.length || 1)) + 1;
  beats.forEach((b, k) => b.classList.toggle('on', k <= Math.floor(((t - t0) % BAR) / BEAT)));
  // enter-pop on posts: easeOutBack over first .30s
  if (SLIDES[idx].type === 'post') {
    const card = el.querySelector('.card'), fr = el.querySelector('.cardframe');
    const tt = t - t0;
    let sc = 1 + 0.045 * tl, rot = 0;
    if (tt < 0.30) { const e = easeOutBack(tt / 0.30); sc *= (0.90 + 0.10 * e); rot = -2.0 * (1 - e); }
    card.style.transform = `scale(${sc}) rotate(${rot}deg)`;
    fr.style.transform = card.style.transform;
    const p = el.querySelector('.prog i'); if (p) p.style.width = (t / DUR * 100) + '%';
  }
  // screech flash at 7.5s + drop flashes at 4th/14th bar
  const screech = Math.max(0, 1 - Math.abs(t - 7.52) / 0.12) * 0.28;
  flash.style.opacity = screech;
  grain.style.backgroundPosition = `${Math.floor(t*60)%270}px ${Math.floor(t*120)%480}px`;
}
window.__reel = { duration: DUR, seek };
</script>
</body>
</html>
