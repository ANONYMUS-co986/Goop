<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Anton';src:url('../../../seed/fonts/Anton.ttf') format('truetype')}

*{margin:0;box-sizing:border-box}body{width:1080px;height:1350px;overflow:hidden;background:#EFE9DC;color:#0c0f0a;font-family:'Archivo',sans-serif;position:relative}
.rule{position:absolute;left:80px;right:80px;height:3px;background:#0c0f0a}
.top{position:absolute;top:64px;left:80px;right:80px;display:flex;justify-content:space-between;font-weight:700;letter-spacing:.26em;font-size:22px;text-transform:uppercase;color:#46503f}
.mid{position:absolute;top:170px;left:0;right:0;display:flex}
.col{width:50%;text-align:center;position:relative}
.col+.col{border-left:3px solid #0c0f0a}
.num{font-family:'Anton';font-size:430px;line-height:.9}
.g{color:#1FA85C}.r{color:#E23A4E}
.lab{font-family:'Anton';font-size:40px;margin-top:20px;letter-spacing:.03em}
.small{font-size:24px;font-weight:700;color:#46503f;margin-top:12px;letter-spacing:.14em;text-transform:uppercase}
.ticks{display:flex;gap:9px;justify-content:center;margin-top:34px}
.ticks i{width:14px;height:56px;background:#1FA85C;display:block}
.slash{position:absolute;font-family:'Anton';font-size:120px;color:#E23A4E;top:452px;left:50%;transform:translateX(-50%) rotate(-16deg)}
.statement{position:absolute;top:830px;left:80px;right:80px;font-family:'Anton';font-size:78px;line-height:1.1;text-align:center}
.statement u{text-decoration:none;border-bottom:12px solid #B9FF3F}
.srcbar{position:absolute;left:80px;right:80px;bottom:64px;border:3px solid #0c0f0a;padding:24px 30px;display:flex;justify-content:space-between;background:#fff;font-weight:700;letter-spacing:.2em;font-size:21px;text-transform:uppercase}
.srcbar b{color:#1FA85C}
</style></head><body>
