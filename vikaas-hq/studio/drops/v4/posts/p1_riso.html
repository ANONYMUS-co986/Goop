<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Anton';src:url('../../../seed/fonts/Anton.ttf') format('truetype')}
@font-face{font-family:'Archivo';src:url('../../../seed/fonts/Archivo.ttf') format('truetype')}
@font-face{font-family:'Devnag';src:url('../../../seed/fonts/NotoSansDevanagari.ttf') format('truetype')}
*{margin:0;box-sizing:border-box}body{width:1080px;height:1350px;overflow:hidden;background:#F2EBDC;color:#111;font-family:'Archivo','Devnag',sans-serif;position:relative}
.halftone{position:absolute;inset:0;background-image:radial-gradient(#111 1.4px,transparent 1.5px);background-size:22px 22px;opacity:.14}
.tear{position:absolute;left:-40px;right:-40px;bottom:300px;height:46px;background:#B9FF3F;transform:rotate(-2.4deg)}
.wrap{position:absolute;inset:0;padding:90px 80px;display:flex;flex-direction:column;justify-content:center}
.kick{font-weight:700;letter-spacing:.3em;text-transform:uppercase;font-size:26px;color:#3c4436;margin-bottom:40px}
.h1{position:relative;font-family:'Devnag';font-weight:700;font-size:200px;line-height:1.02;letter-spacing:.01em}
.h1 .m{position:absolute;left:10px;top:8px;color:#FF3FA4;mix-blend-mode:multiply;z-index:0}
.h1 .t{position:absolute;left:-8px;top:-7px;color:#2E9EDE;mix-blend-mode:multiply;z-index:0}
.h1 .b{position:relative;z-index:2;color:#111}
.row2{margin-top:56px;font-family:'Anton','Devnag';font-size:54px;letter-spacing:.02em;line-height:1.15;max-width:900px}
.row2 b{background:#B9FF3F;padding:0 18px}
.sub{margin-top:inherit;margin-top:44px;font-size:27px;color:#3c4436;letter-spacing:.06em;font-weight:700}
.sticker{position:absolute;right:84px;top:740px;transform:rotate(7deg);background:#FF3FA4;color:#fff;font-family:'Anton','Devnag';padding:22px 30px;font-size:36px;border-radius:16px;box-shadow:7px 7px 0 #111}
.foot{position:absolute;left:80px;right:80px;bottom:70px;display:flex;justify-content:space-between;font-weight:700;letter-spacing:.24em;text-transform:uppercase;font-size:22px;color:#3c4436;border-top:3px solid #111;padding-top:26px}
</style></head><body>
<div class="halftone"></div><div class="tear"></div>
<div class="wrap">
  <div class="kick">the national drawer anthem · est. 2014</div>
  <div class="h1"><span class="m">कभी काम<br>आएगा।</span><span class="t">कभी काम<br>आएगा।</span><span class="b">कभी काम<br>आएगा।</span></div>
  <div class="row2">said every dead charger <b>मरने से पहले।</b></div>
  <div class="sub">it never did. recycle it instead. #EWasteOff</div>
</div>
<div class="sticker">LIE #001</div>
<div class="foot"><span>@qwerty_aarav</span><span>vikaas · riso meme 01</span></div>
</body></html>
