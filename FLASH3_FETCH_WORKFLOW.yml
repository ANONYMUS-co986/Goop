name: fetch-video
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube URL to download'
        required: true
        default: 'https://www.youtube.com/watch?v=9P6xal4dWKLo'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/019ff044-goop
      - name: Install yt-dlp
        run: pip install yt-dlp
      - name: Download video
        run: |
          yt-dlp -f "mp4" -o "vikaas-hq/flash3_brief.mp4" "${{ github.event.inputs.url }}" \
            || yt-dlp -f "worst" -o "vikaas-hq/flash3_brief.mp4" "${{ github.event.inputs.url }}"
      - name: Commit + push video
        run: |
          git config user.name "vikaas-bot"
          git config user.email "bot@vikaas.in"
          git add vikaas-hq/flash3_brief.mp4
          git commit -m "Flash 3 brief video (fetched via Actions — full internet)" || true
          git push origin arena/019ff044-goop
