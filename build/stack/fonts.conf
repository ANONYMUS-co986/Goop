<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/home/user/Goop/build/assets/fonts-ttf</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <cachedir>/home/user/stack/var/cache/fontconfig</cachedir>
  <!-- prefer DejaVu for glyphs Space Grotesk/Inter lack (₹ etc.) -->
  <match target="pattern">
    <test qual="any" name="family"><string>Space Grotesk</string></test>
    <edit name="family" mode="append" binding="weak"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Inter</string></test>
    <edit name="family" mode="append" binding="weak"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
